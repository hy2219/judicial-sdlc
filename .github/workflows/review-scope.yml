name: Trusted PR scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  scope:
    if: github.event.repository.private && !github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Trusted default-branch workflow/code; never execute PR or task source.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check event-head scope through read-only GitHub API calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/review_scope.py
