name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'plans/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public-content preflight
        run: python .github/scripts/check_public_content.py
      - name: Install lightweight dependencies (OCR packaging follows accepted merges)
        run: python -m pip install -r modules/ocr/requirements-text.txt
      - name: Install Korean font and virtual GUI support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum xvfb xauth
      - name: Verify source GUI display
        run: |
          xvfb-run -a python - <<'PY'
          import tkinter as tk
          window = tk.Tk()
          try:
              window.update()
          finally:
              window.destroy()
          PY
      - name: Unit tests
        run: xvfb-run -a python .github/scripts/runtime_check.py --phase unit
      - name: Headless synthetic self-test
        run: python run.py --self-test

  e2e:
    needs: test
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public-content preflight
        run: python .github/scripts/check_public_content.py
      - name: Install Korean font and virtual GUI support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum xvfb xauth
      - name: Install pinned CPU-only PyTorch wheels
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned OCR dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify CPU-only PyTorch installation
        run: python -c "import torch; assert torch.version.cuda is None, 'CUDA builds are not allowed'"
      - name: Prepare verified OCR models and license notices
        run: python modules/ocr/prepare.py
      - name: Verify source GUI display
        run: |
          xvfb-run -a python - <<'PY'
          import tkinter as tk
          window = tk.Tk()
          try:
              window.update()
          finally:
              window.destroy()
          PY
      - name: Source offline Korean and English OCR self-test
        run: python -m tests.ocr_check
      - name: Unit tests in this E2E environment
        run: xvfb-run -a python .github/scripts/runtime_check.py --phase unit --unit-results "${{ runner.temp }}/unit-results.json"
      - name: E2E tests (actual OCR, HTTP, GUI and export)
        run: xvfb-run -a python .github/scripts/runtime_check.py --phase e2e --unit-results "${{ runner.temp }}/unit-results.json"
