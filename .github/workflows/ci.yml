name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'plans/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public-content preflight
        run: python .github/scripts/check_public_content.py
      - name: Install lightweight dependencies (OCR packaging follows accepted merges)
        run: python -m pip install -r modules/ocr/requirements-text.txt
      - name: Unit tests
        run: python .github/scripts/runtime_check.py --phase unit
      - name: Headless synthetic self-test
        run: python run.py --self-test
