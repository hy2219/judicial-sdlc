name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.txt
      - modules/ocr/requirements*.txt
      - packaging/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.txt
      - modules/ocr/requirements*.txt
      - packaging/requirements.txt

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Korean font and virtual GUI support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum xvfb xauth
      - name: Install pinned CPU-only PyTorch wheels
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned OCR dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify CPU-only OCR imports
        run: |
          python - <<'PY'
          import torch, torchvision, easyocr, transformers, pypdfium2, PIL, numpy, cv2
          assert torch.version.cuda is None, "CUDA builds are not allowed"
          PY
      - name: Prepare verified OCR models and license notices
        run: python modules/ocr/prepare.py
      - name: Verify Korean font and source GUI
        run: |
          xvfb-run -a python - <<'PY'
          import tkinter as tk
          from PIL import ImageFont
          from tests.ocr_fixtures import sample_font
          ImageFont.truetype(str(sample_font()), 24)
          window = tk.Tk()
          try:
              window.update()
          finally:
              window.destroy()
          PY
      - name: Verify real offline Korean and English OCR
        run: python -m tests.ocr_check
      - name: Verify Unit tests with virtual GUI
        run: xvfb-run -a python .github/scripts/runtime_check.py --phase unit
      - name: Verify headless CLI
        run: python run.py --self-test
